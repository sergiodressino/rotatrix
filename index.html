<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotatrix: Gravity Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Canvas de fondo espacial que cubre toda la pantalla -->
    <canvas id="bg-canvas"></canvas>

    <div id="score-board">
        <div>NIVEL: <span id="val-level">1</span>/50</div>
        <div>SCORE: <span id="val-score">0</span></div>
    </div>

    <div id="progress-container">
        <div id="level-bar"></div>
        <span id="level-label">NIVEL 1 - 0%</span>
    </div>

    <div id="fever-container">
        <div id="fever-bar"></div>
        <span id="fever-label">FEVER MODE</span>
    </div>

    <div id="game-box">
        <canvas id="cvs" width="360" height="360"></canvas>
        
        <!-- Pantalla Inicial y Menús -->
        <div id="mask">
            <div id="main-menu">
                <h1>ROTATRIX</h1>
                <p class="subtitle">GRAVITY RUSH</p>
                <div class="menu-buttons">
                    <button id="btn-arcade-menu">MODO ARCADE</button>
                    <button id="btn-practice-menu">MODO PRÁCTICA</button>
                </div>
            </div>

            <!-- Menú Arcade -->
            <div id="arcade-menu" class="hidden">
                <h2>ARCADE</h2>
                <div class="mode-options">
                    <button class="btn-mode" data-mode="easy">FÁCIL</button>
                    <button class="btn-mode" data-mode="normal">NORMAL</button>
                    <button class="btn-mode" data-mode="hard">DIFÍCIL</button>
                    <button class="btn-mode" data-mode="adrenaline">ADRENALINA</button>
                </div>
                <button class="btn-back">VOLVER</button>
            </div>

            <!-- Menú Práctica -->
            <div id="practice-menu" class="hidden">
                <h2>PRÁCTICA</h2>
                <div class="practice-settings">
                    <div class="setting-item">
                        <span>PIEZAS: <span id="val-p-colors">4</span></span>
                        <div class="spin-ctrl">
                            <button id="p-colors-down">-</button>
                            <button id="p-colors-up">+</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span>VELOCIDAD: <span id="val-p-speed">1X</span></span>
                        <div class="spin-ctrl">
                            <button id="p-speed-down">-</button>
                            <button id="p-speed-up">+</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span>FEVER: <span id="val-p-fever">NORMAL</span></span>
                        <div class="spin-ctrl">
                            <button id="p-fever-down">-</button>
                            <button id="p-fever-up">+</button>
                        </div>
                    </div>
                    <div class="setting-item">
                        <span>OLEADA: <span id="val-p-wave">OFF</span></span>
                        <div class="spin-ctrl">
                            <button id="p-wave-toggle">ON/OFF</button>
                        </div>
                    </div>
                </div>
                <button id="btn-practice-start">¡JUGAR!</button>
                <button class="btn-back">VOLVER</button>
            </div>
        </div>

        <!-- Pantalla de Pausa -->
        <div id="pause-mask" class="hidden">
            <h2>PAUSA</h2>
            <p>Presiona [P] o toca aquí para continuar</p>
        </div>

        <!-- Pantalla Impactante de Game Over -->
        <div id="game-over-mask" class="hidden">
            <h1 class="go-title">GAME OVER</h1>
            <div class="go-stats">
                <div class="stat-item">PUNTOS: <span id="go-score">0</span></div>
                <div class="stat-item">NIVEL: <span id="go-level">1</span></div>
                <div class="stat-item hi">RÉCORD: <span id="go-hi">0</span></div>
            </div>
            <button id="btn-restart">REINTENTAR</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn-act" id="btn-left">↺</button>
        <button class="btn-act" id="btn-drop">⤓</button>
        <button class="btn-act" id="btn-right">↻</button>
    </div>

    <div id="key-hints">
        <span>[←/A] Izq</span>
        <span>[↓/ESPACIO] Caída</span>
        <span>[→/D] Der</span>
        <span>[P] Pausa</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
